name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算小写镜像名
        id: image
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}-backend:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 math-utils 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.base }}

      - name: 构建并推送 backend 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.backend }}

      - name: 构建并推送 frontend 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image.outputs.frontend }}

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
