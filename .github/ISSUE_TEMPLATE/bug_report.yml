name: Bug 报告
description: 报告一个 bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢提交 issue！请按照下面的格式填写，格式不规范的 issue 会被自动关闭。"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: "1. 执行 xxx\n2. 得到错误结果"
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你期望发生什么
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么
